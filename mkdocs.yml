site_name: VigyanShaala ILP — Student Guide
site_description: Student user guide for the VigyanShaala International Learning Platform.
site_url: https://help.mycommunity.vigyanshaala.com/

theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.ico
  font:
    text: Nunito Sans
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.share
    - content.code.copy

plugins:
  - search:
      lang: en
      # No stemmer: Material adds trailing * to queries, which skips stemming
      # and then misses indexed stems (certificate* vs certific, install* vs instal).
      separator: '[\s\-,:!=\[\]()"/<>]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      pipeline:
        - stopWordFilter
        - trimmer

hooks:
  - hooks.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/site-scope.js
  - javascripts/admin-redirects.js
  - javascripts/breadcrumbs.js
  - javascripts/section-focus.js
  - javascripts/back-to-top.js
  - javascripts/search.js
  - javascripts/pdf-download.js

extra:
  generator: false
  platform_url: https://mycommunity.vigyanshaala.com/

not_in_nav: |
